services:
  options-monitor:
    build: .
    mem_limit: 5g
    ports:
      - "${PORT:-8501}:8501"
    volumes:
      - "${TICKRAKE_HOME:-$HOME/.tickrake}:/tickrake:ro"
      - "${HOME}/.aws:/root/.aws:ro"
    environment:
      TICKRAKE_HOME: /tickrake
      MINIO_ENDPOINT: "http://host.docker.internal:9000"
      MINIO_BUCKET: "${MINIO_BUCKET:-tickrake-intraday}"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-minioadmin}"
      S3_BUCKET: "${S3_BUCKET:-}"
      S3_REGION: "${S3_REGION:-us-east-1}"
