# Dev compose — uses non-default ports to avoid conflicts with prod (quant-infra).
# MinIO API: 9002, MinIO Console: 9003, Streamlit: 8502
services:
  minio:
    image: minio/minio:latest
    ports:
      - "9002:9000"
      - "9003:9001"
    volumes:
      - minio-data:/data
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_KEY:-minioadmin}"
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 3

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb --ignore-existing local/${MINIO_INTRADAY_BUCKET:-tickrake-intraday};
      mc mb --ignore-existing local/${MINIO_HISTORICAL_BUCKET:-tickrake-historical};
      exit 0;
      "

  options-monitor:
    build: .
    mem_limit: 5g
    depends_on:
      minio-init:
        condition: service_completed_successfully
    ports:
      - "8502:8501"
    volumes:
      - "${TRACTATUS_CACHE_DIR:-$HOME/.tractatus/cache}:/root/.tractatus/cache"
      - "${OPTIONS_MONITOR_CACHE_DIR:-$HOME/.cache/options-monitor}:/root/.cache/options-monitor"
      - "${HOME}/.aws:/root/.aws:ro"
      - "./src:/app/src"
      - "${TRACTATUS_SRC:-${HOME}/repos/tractatus/src}:/tractatus/src"
    environment:
      TRACTATUS_CACHE_DIR: /root/.tractatus/cache
      OPTIONS_MONITOR_CACHE_DIR: /root/.cache/options-monitor
      OPTIONS_MONITOR_TIMEZONE: "${OPTIONS_MONITOR_TIMEZONE:-America/Chicago}"
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_INTRADAY_BUCKET: "${MINIO_INTRADAY_BUCKET:-tickrake-intraday}"
      MINIO_HISTORICAL_BUCKET: "${MINIO_HISTORICAL_BUCKET:-tickrake-historical}"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-minioadmin}"
      PYTHONPATH: "/tractatus/src:/app/src"

volumes:
  minio-data:
