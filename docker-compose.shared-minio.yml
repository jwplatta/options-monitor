# Development app isolated from production, reading the existing MinIO service.
# Run with: make dev-shared
services:
  options-monitor:
    build: .
    mem_limit: 5g
    ports:
      - "8502:8501"
    volumes:
      - "${TRACTATUS_CACHE_DIR:-$HOME/.tractatus/cache}:/root/.tractatus/cache"
      - "${OPTIONS_MONITOR_CACHE_DIR:-$HOME/.cache/options-monitor}:/root/.cache/options-monitor"
      - "${HOME}/.aws:/root/.aws:ro"
      - "./src:/app/src:ro"
      - "${TRACTATUS_SRC:-${HOME}/repos/tractatus/src}:/tractatus/src:ro"
    environment:
      PYTHONPATH: /tractatus/src:/app/src
      TRACTATUS_CACHE_DIR: /root/.tractatus/cache
      OPTIONS_MONITOR_CACHE_DIR: /root/.cache/options-monitor
      MINIO_ENDPOINT: "${MINIO_ENDPOINT:-http://host.docker.internal:9000}"
      MINIO_INTRADAY_BUCKET: "${MINIO_INTRADAY_BUCKET:-tickrake-intraday}"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-minioadmin}"
      ICEBERG_CATALOG_TYPE: "${ICEBERG_CATALOG_TYPE:-sql}"
      MINIO_ICEBERG_BUCKET: "${MINIO_ICEBERG_BUCKET:-tractatus-iceberg}"
      ICEBERG_POSTGRES_URL: "${ICEBERG_POSTGRES_URL:-postgresql+psycopg2://tractatus_user:tractatus@host.docker.internal:5432/tractatus}"
      GLUE_DATABASE: "${GLUE_DATABASE:-tractatus}"
      S3_BUCKET: "${S3_BUCKET:-}"
      S3_REGION: "${S3_REGION:-us-east-1}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "streamlit"
      - "run"
      - "src/options_monitor/app.py"
      - "--server.port=8501"
      - "--server.address=0.0.0.0"
      - "--server.headless=true"
      - "--server.runOnSave=true"
