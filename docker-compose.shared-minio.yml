# Development app isolated from production, reading the existing MinIO service.
# Run with: make dev-shared
services:
  options-monitor:
    build: .
    mem_limit: 5g
    ports:
      - "8502:8501"
    volumes:
      - "${TRACTATUS_CACHE_DIR:-$HOME/.tractatus/cache}:/root/.tractatus/cache"
      - "${HOME}/.aws:/root/.aws:ro"
      - "./src:/app/src:ro"
    environment:
      PYTHONPATH: /app/src
      TRACTATUS_CACHE_DIR: /root/.tractatus/cache
      MINIO_ENDPOINT: "${MINIO_ENDPOINT:-http://host.docker.internal:9000}"
      MINIO_INTRADAY_BUCKET: "${MINIO_INTRADAY_BUCKET:-tickrake-intraday}"
      MINIO_HISTORICAL_BUCKET: "${MINIO_HISTORICAL_BUCKET:-tickrake-historical}"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-minioadmin}"
      S3_BUCKET: "${S3_BUCKET:-}"
      S3_REGION: "${S3_REGION:-us-east-1}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "streamlit"
      - "run"
      - "src/options_monitor/app.py"
      - "--server.port=8501"
      - "--server.address=0.0.0.0"
      - "--server.headless=true"
      - "--server.runOnSave=true"
