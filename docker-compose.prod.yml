# Prod compose — connects to the local MinIO instance already running at port 9001.
# No MinIO service is started here; options-monitor points to host MinIO directly.
# MinIO API: host:9000 (default), Streamlit: 8501
services:
  options-monitor:
    build: .
    mem_limit: 5g
    ports:
      - "${PORT:-8501}:8501"
    volumes:
      - "${TRACTATUS_CACHE_DIR:-$HOME/.tractatus/cache}:/root/.tractatus/cache"
      - "${HOME}/.aws:/root/.aws:ro"
    environment:
      TRACTATUS_CACHE_DIR: /root/.tractatus/cache
      MINIO_ENDPOINT: "${MINIO_ENDPOINT:-http://host.docker.internal:9000}"
      MINIO_INTRADAY_BUCKET: "${MINIO_INTRADAY_BUCKET:-tickrake-intraday}"
      MINIO_HISTORICAL_BUCKET: "${MINIO_HISTORICAL_BUCKET:-tickrake-historical}"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-minioadmin}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-minioadmin}"
      S3_BUCKET: "${S3_BUCKET:-}"
      S3_REGION: "${S3_REGION:-us-east-1}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
